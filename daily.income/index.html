<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOFI Parser</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>
:root{--bg:#071225;--card:#10213d;--line:#263a5e;--text:#f6f8ff;--muted:#9eafc8;--green:#22c55e;--red:#ff7043;--soft:#071326;--blue:#2f4b78}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:850px;margin:auto;padding:12px}h1{font-size:25px}h2{font-size:23px}.card{background:linear-gradient(180deg,var(--card),#0b1930);border:1px solid var(--line);border-radius:22px;padding:14px;margin:14px 0}p,.small{color:var(--muted)}button{border:0;border-radius:15px;padding:13px;font-weight:800;font-size:17px;color:white;background:var(--blue);width:100%;margin:7px 0}.green{background:#11a861}input,select{width:100%;background:var(--soft);border:1px solid #2b4068;color:white;border-radius:13px;padding:10px;font-size:16px;text-align:center}textarea{display:none}.preview{width:100%;border-radius:16px;border:1px solid var(--line);margin-top:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:#132746;border-radius:16px;padding:13px}.label{color:var(--muted);font-size:14px}.value{font-size:27px;font-weight:900}.tableWrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}th,td{border-bottom:1px solid var(--line);padding:8px 4px}th{color:var(--muted);font-size:14px}.typeCall,.priceCall{color:var(--green);border-color:var(--green);font-weight:900}.typePut,.pricePut{color:var(--red);border-color:var(--red);font-weight:900}.family{white-space:pre-wrap;background:var(--soft);border:1px solid #2b4068;border-radius:16px;padding:13px;color:#dfe8f7}.stockRow{display:grid;grid-template-columns:1fr 1fr 110px;gap:10px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:13px}.bad{color:#ff9c85}.good{color:#5ee29c}
</style></head><body><div class="wrap"><h1>SOFI Screen Parser</h1><p>OCR이 빈칸에 숫자를 넣습니다. 틀리면 그 자리에서 고치고 적용하세요.</p>
<div class="card"><input id="file" type="file" accept="image/*"><img id="preview" class="preview" style="display:none"><button onclick="runOCR()">이미지 OCR 시도</button><div id="ocrStatus" class="small"></div><textarea id="ocrText"></textarea></div>
<div class="card"><h2>계좌 요약</h2><div class="grid"><div class="box"><div class="label">Buying Power</div><input id="buyingPower" type="number" step="0.01"></div><div class="box"><div class="label">SOFI 현재가</div><input id="stockPrice" type="number" step="0.01"></div><div class="box"><div class="label">SOFI 주식수</div><input id="shares" type="number"></div><div class="box"><div class="label">누적 프리미엄(선택)</div><input id="cumPremium" type="number" value="0"></div></div></div>
<div class="card"><h2>옵션 목록</h2><div class="tableWrap"><table><thead><tr><th>종류</th><th>행사가</th><th>만기</th><th>계약</th><th>현재가</th></tr></thead><tbody id="optBody"></tbody></table></div><button class="green" onclick="calculate()">변경사항 적용하기</button></div>
<details class="card"><summary style="font-size:22px;font-weight:900">옵션 요약 / 부채 참고</summary><div class="grid"><div class="box"><div class="label">옵션부채 합계</div><div class="value bad" id="optionLiability">$0.00</div></div><div class="box"><div class="label">총 계약 수</div><div class="value" id="totalContracts">0</div></div><div class="box"><div class="label">가중 평균</div><div class="value" id="avgPrice">0.0000</div></div><div class="box"><div class="label">현재가 합계</div><div class="value" id="sumPrice">0.00</div></div></div></details>
<div class="card"><h2>주식 보유</h2><div class="stockRow"><b>SOFI</b><span><span id="sharesView">-</span> 주식</span><b class="pricePut" id="stockPriceView">$0.00</b></div><button class="green" onclick="saveRecord()">오늘 기록 저장</button><button onclick="exportCSV()">CSV 백업 다운로드</button></div>
<div class="card"><h2>가족에게 보여줄 설명</h2><div id="familyText" class="family">OCR 후 숫자를 검수하고 적용하기를 누르면 표시됩니다.</div></div><div class="card"><h2>저장 기록</h2><div id="history"></div></div></div>
<script>
let imageDataUrl="",lastCalc=null;const fmt=n=>"$"+(Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
document.getElementById("file").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{imageDataUrl=r.result;preview.src=imageDataUrl;preview.style.display="block"};r.readAsDataURL(f)});
function addRow(d){const tr=document.createElement("tr");tr.innerHTML=`<td><select class="type ${d.type=="Put"?"typePut":"typeCall"}" onchange="calculate()"><option ${d.type=="Call"?"selected":""}>Call</option><option ${d.type=="Put"?"selected":""}>Put</option></select></td><td><input class="strike" type="number" step="0.5" value="${d.strike||""}" oninput="calculate()"></td><td><input class="exp" value="${d.exp||""}" placeholder="5/29" oninput="calculate()"></td><td><input class="contracts" type="number" value="${d.contracts||""}" oninput="calculate()"></td><td><input class="price ${d.type=="Put"?"pricePut":"priceCall"}" type="number" step="0.01" value="${d.price||""}" oninput="calculate()"></td>`;optBody.appendChild(tr)}
function blankRows(){optBody.innerHTML="";["Call","Call","Put","Put"].forEach(t=>addRow({type:t}))}
async function runOCR(){if(!imageDataUrl){alert("먼저 이미지를 선택하세요.");return}ocrStatus.textContent="OCR 진행 중...";try{const res=await Tesseract.recognize(imageDataUrl,"eng",{logger:m=>{if(m.status)ocrStatus.textContent=m.status+" "+Math.round((m.progress||0)*100)+"%"}});ocrText.value=res.data.text;parseText();ocrStatus.textContent="OCR 완료. 숫자를 확인하고 필요하면 바로 고친 뒤 적용하세요."}catch(e){ocrStatus.textContent="OCR 실패: "+e.message}}
function money(s){return Number(String(s).replace(/[$,\s]/g,""))}
function parseText(){const txt=ocrText.value,lines=txt.split(/\n/).map(x=>x.trim()).filter(Boolean);let bp=txt.match(/Buying\s*power\s*\$?\s*([\d,]+\.\d{2})/i);if(bp)buyingPower.value=money(bp[1]);let sh=txt.match(/(\d{4,6})\s*shares/i);if(sh)shares.value=Number(sh[1]);let pm=[...txt.matchAll(/\$\s*(1[0-9]\.\d{2})/g)].map(m=>money(m[1]));if(pm.length)stockPrice.value=pm[pm.length-1];let rows=[];for(let i=0;i<lines.length;i++){let m=lines[i].match(/SOFI\s*\$?(\d+(?:\.\d+)?)\s*(Call|Put)/i);if(m){let exp="",contracts="",price="";for(let j=i+1;j<Math.min(i+7,lines.length);j++){let e=lines[j].match(/(\d{1,2}\/\d{1,2}).*?(\d+)\s*Sells/i);if(e){exp=e[1];contracts=e[2]}let p=lines[j].match(/\$\s*(\d+\.\d{2})/);if(p&&!price)price=p[1]}rows.push({type:m[2][0].toUpperCase()+m[2].slice(1).toLowerCase(),strike:m[1],exp,contracts,price})}}optBody.innerHTML="";(rows.length?rows:[{type:"Call"},{type:"Call"},{type:"Put"},{type:"Put"}]).forEach(addRow);calculate()}
function getRows(){return[...document.querySelectorAll("#optBody tr")].map(tr=>{let type=tr.querySelector(".type").value,strike=Number(tr.querySelector(".strike").value)||0,exp=tr.querySelector(".exp").value,contracts=Number(tr.querySelector(".contracts").value)||0,price=Number(tr.querySelector(".price").value)||0;tr.querySelector(".type").className="type "+(type=="Put"?"typePut":"typeCall");tr.querySelector(".price").className="price "+(type=="Put"?"pricePut":"priceCall");return{type,strike,exp,contracts,price,debt:contracts*price*100}}).filter(r=>r.strike||r.contracts||r.price)}
function calculate(){let bp=Number(buyingPower.value)||0,sp=Number(stockPrice.value)||0,sh=Number(shares.value)||0,rows=getRows(),liab=rows.reduce((a,r)=>a+r.debt,0),total=rows.reduce((a,r)=>a+r.contracts,0),sum=rows.reduce((a,r)=>a+r.price,0),avg=total?rows.reduce((a,r)=>a+r.contracts*r.price,0)/total:0,stockValue=sp*sh,net=bp+stockValue-liab;sharesView.textContent=sh||"-";stockPriceView.textContent=fmt(sp);optionLiability.textContent=fmt(liab);totalContracts.textContent=total;avgPrice.textContent=avg.toFixed(4);sumPrice.textContent=sum.toFixed(2);lastCalc={time:new Date().toLocaleString(),bp,sp,shares:sh,stockValue,liab,net,rows};familyText.textContent=`SOFI 현재가: ${fmt(sp)}\n보유 주식수: ${sh.toLocaleString()}주\nBuying Power: ${fmt(bp)}\n\n옵션부채 합계(참고): ${fmt(liab)}\n총 계약 수: ${total}\n\n이 부채는 화면에 직접 보이는 값은 아니고 계약수 × 현재가 × 100으로 계산한 참고값입니다.`;renderHistory()}
function saveRecord(){calculate();let h=JSON.parse(localStorage.getItem("sofiRecords")||"[]");h.push(lastCalc);localStorage.setItem("sofiRecords",JSON.stringify(h));alert("저장되었습니다.");renderHistory()}
function renderHistory(){let h=JSON.parse(localStorage.getItem("sofiRecords")||"[]");history.innerHTML=h.length?h.slice(-10).reverse().map(r=>`<div class="box" style="margin:10px 0"><div class="label">${r.time}</div><div>SOFI ${fmt(r.sp)} / 옵션참고부채 ${fmt(r.liab)}</div></div>`).join(""):"<p class='small'>아직 저장 기록이 없습니다.</p>"}
function exportCSV(){let h=JSON.parse(localStorage.getItem("sofiRecords")||"[]");if(!h.length){alert("저장 기록이 없습니다.");return}let rows=[["time","buyingPower","stockPrice","shares","stockValue","optionLiability","netView"]];h.forEach(r=>rows.push([r.time,r.bp,r.sp,r.shares,r.stockValue,r.liab,r.net]));let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"}));a.download="sofi_daily_records.csv";a.click()}
blankRows();renderHistory();
</script></body></html>
