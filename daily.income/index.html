<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SOFI Premium Tracker PRO v3.0</title>

<style>

body{
    margin:0;
    padding:18px;
    background:#000;
    color:#00ff99;
    font-family:Arial,sans-serif;
}

.header{
    font-size:42px;
    font-weight:900;
    line-height:1.05;
    margin-bottom:10px;
}

.version{
    color:#888;
    margin-bottom:25px;
}

.card{
    background:#050510;
    border-radius:28px;
    padding:24px;
    margin-bottom:24px;
    box-shadow:0 0 25px rgba(0,255,150,0.12);
}

.title{
    font-size:30px;
    font-weight:800;
    margin-bottom:20px;
    line-height:1.2;
}

.label{
    color:#aaa;
    margin-top:18px;
    font-size:16px;
}

input{
    width:100%;
    padding:18px;
    margin-top:8px;
    border:none;
    border-radius:18px;
    background:#111;
    color:#00ff99;
    font-size:22px;
    box-sizing:border-box;
}

button{
    width:100%;
    margin-top:20px;
    padding:20px;
    border:none;
    border-radius:20px;
    background:#00ff99;
    color:#000;
    font-size:24px;
    font-weight:900;
}

.result{
    margin-top:25px;
    font-size:22px;
    line-height:1.7;
}

.good{
    color:#00ff99;
}

.warn{
    color:#ffcc00;
}

.red{
    color:#ff6666;
}

.small{
    color:#888;
    font-size:14px;
    margin-top:20px;
}

.preview{
    width:100%;
    border-radius:20px;
    margin-top:20px;
    display:none;
}

.saveBox{
    background:#111;
    border-radius:18px;
    padding:18px;
    margin-top:20px;
}

</style>

</head>

<body>

<div class="header">
💸 SOFI Premium<br>
Tracker PRO
</div>

<div class="version">
Version 3.0 • Stable Mobile Version
</div>

<div class="card">

<div class="title">
Robinhood 캡쳐 저장
</div>

<input
type="file"
id="imageUpload"
accept="image/*"
/>

<img
id="preview"
class="preview"
>

<div class="label">
SOFI 현재가
</div>

<input
type="number"
id="sofi"
placeholder="15.71"
/>

<div class="label">
Buying Power
</div>

<input
type="number"
id="buying"
placeholder="54150"
/>

<div class="label">
현재 옵션 채무
</div>

<input
type="number"
id="debt"
placeholder="15960"
/>

<div class="label">
누적 프리미엄
</div>

<input
type="number"
id="premium"
placeholder="28500"
/>

<div class="label">
하루 예상 Theta 수익
</div>

<input
type="number"
id="theta"
placeholder="420"
/>

<button
type="button"
onclick="saveData()"
>
💾 저장 및 계산
</button>

<div
id="result"
class="result"
></div>

<div class="saveBox">

<div class="small">
📌 자동 저장 활성화
</div>

<div class="small">
새로고침해도 데이터 유지
</div>

</div>

</div>

<script>

window.onload = function(){

loadData();

document
.getElementById('imageUpload')
.addEventListener('change', previewImage);

};

function previewImage(){

const file =
document
.getElementById('imageUpload')
.files[0];

if(!file) return;

const preview =
document.getElementById('preview');

preview.src =
URL.createObjectURL(file);

preview.style.display = "block";

}

function saveData(){

const data = {

sofi:
document.getElementById('sofi').value,

buying:
document.getElementById('buying').value,

debt:
document.getElementById('debt').value,

premium:
document.getElementById('premium').value,

theta:
document.getElementById('theta').value

};

localStorage.setItem(
"sofiTracker",
JSON.stringify(data)
);

calculate();

}

function loadData(){

const saved =
localStorage.getItem("sofiTracker");

if(!saved) return;

const data =
JSON.parse(saved);

document.getElementById('sofi').value =
data.sofi || "";

document.getElementById('buying').value =
data.buying || "";

document.getElementById('debt').value =
data.debt || "";

document.getElementById('premium').value =
data.premium || "";

document.getElementById('theta').value =
data.theta || "";

calculate();

}

function calculate(){

const sofi =
Number(document.getElementById('sofi').value);

const buying =
Number(document.getElementById('buying').value);

const debt =
Number(document.getElementById('debt').value);

const premium =
Number(document.getElementById('premium').value);

const theta =
Number(document.getElementById('theta').value);

const week =
theta * 5;

const month =
theta * 20;

const effective =
premium / 15000;

const remain =
theta > 0 ? debt / theta : 0;

document
.getElementById('result')
.innerHTML = `

<div class="good">
📈 SOFI 현재가:
$${sofi.toFixed(2)}
</div>

<div class="warn">
💰 Buying Power:
$${buying.toFixed(2)}
</div>

<br>

<div class="good">
📅 하루 예상 Theta:
$${theta.toFixed(2)}
</div>

<div class="good">
1주 예상:
$${week.toFixed(2)}
</div>

<div class="good">
1달 예상:
$${month.toFixed(2)}
</div>

<br>

<div class="red">
현재 옵션 채무:
$${debt.toFixed(2)}
</div>

<div class="good">
누적 프리미엄:
$${premium.toFixed(2)}
</div>

<br>

<div class="warn">
체감 평단 감소:
$${effective.toFixed(2)} / share
</div>

<div class="warn">
채무 예상 소멸:
약 ${remain.toFixed(1)} 일
</div>

`;

}

</script>

</body>
</html>
