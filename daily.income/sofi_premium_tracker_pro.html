<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOFI Premium Tracker PRO</title>

<style>

body{
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
}

.card{
    background:#111;
    border-radius:20px;
    padding:25px;
    margin-bottom:25px;
    box-shadow:0 0 20px rgba(0,255,100,0.08);
}

h1{
    color:#00ff99;
    margin-bottom:30px;
    font-size:72px;
}

h2{
    color:#00ff99;
    margin-top:0;
    font-size:52px;
}

label{
    display:block;
    margin-top:18px;
    margin-bottom:8px;
    font-size:34px;
}

input{
    width:100%;
    padding:20px;
    border:none;
    border-radius:14px;
    background:#222;
    color:white;
    font-size:44px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:22px;
    margin-top:25px;
    border:none;
    border-radius:16px;
    background:#00b96b;
    color:white;
    font-size:42px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#00d67c;
}

.result{
    font-size:38px;
    margin-top:20px;
    line-height:1.8;
}

.green{
    color:#00ff99;
}

.snapshot{
    background:#1a1a1a;
    padding:16px;
    border-radius:12px;
    margin-top:10px;
    font-size:32px;
}

</style>
</head>

<body>

<div class="container">

<h1>SOFI Premium Tracker PRO</h1>

<div class="card">

<h2>현재 상태 입력</h2>

<label>현재 옵션 채무 ($)</label>
<input type="number" id="debt" value="25685">

<label>현재 SOFI 가격</label>
<input type="number" step="0.01" id="price" value="15.66">

<label>현재 계좌뷰 ($)</label>
<input type="number" id="account" value="250000">

<label>오늘 녹은 옵션 금액 ($)</label>
<input type="number" id="melt" value="2300">

<label>남은 평균 DTE (일)</label>
<input type="number" id="dte" value="14">

<button onclick="calculate()">계산하기</button>

<div class="result" id="result">

오늘 옵션수익: $0<br>
주간 예상수익: $0<br>
월간 예상수익: $0

</div>

</div>

<div class="card">

<h2>AM Snapshot</h2>

<label>아침 옵션 채무</label>
<input type="number" id="amDebt">

<label>아침 SOFI 가격</label>
<input type="number" step="0.01" id="amPrice">

<button onclick="saveAM()">AM 저장</button>

<div id="amResult" class="snapshot"></div>

</div>

<div class="card">

<h2>PM Snapshot</h2>

<label>저녁 옵션 채무</label>
<input type="number" id="pmDebt">

<label>저녁 SOFI 가격</label>
<input type="number" step="0.01" id="pmPrice">

<button onclick="savePM()">PM 저장</button>

<div id="pmResult" class="snapshot"></div>

</div>

<div class="card">

<h2>오늘 변화 분석</h2>

<div class="result" id="analysis">

옵션 채무 감소: $0<br>
SOFI 변화: $0<br>
세타 효과: $0

</div>

</div>

</div>

<script>

function calculate(){

    let debt =
        parseFloat(document.getElementById('debt').value) || 0;

    let melt =
        parseFloat(document.getElementById('melt').value) || 0;

    let dte =
        parseFloat(document.getElementById('dte').value) || 1;

    let dailyTheta =
        debt / dte;

    let weekly =
        dailyTheta * 7;

    let monthly =
        dailyTheta * 30;

    document.getElementById('result').innerHTML =

        '<span class="green">오늘 옵션수익: $'
        + melt.toLocaleString() +

        '</span><br><br>' +

        '<span class="green">예상 하루 세타 감소: $'
        + dailyTheta.toFixed(0) +

        '</span><br><br>' +

        '<span class="green">주간 예상수익: $'
        + weekly.toFixed(0) +

        '</span><br><br>' +

        '<span class="green">월간 예상수익: $'
        + monthly.toFixed(0) +

        '</span>';

}

function saveAM(){

    let debt =
        document.getElementById('amDebt').value;

    let price =
        document.getElementById('amPrice').value;

    localStorage.setItem('amDebt',debt);
    localStorage.setItem('amPrice',price);

    document.getElementById('amResult').innerHTML =

        'AM 저장 완료<br><br>' +

        '옵션채무: $' + debt + '<br>' +

        'SOFI 가격: $' + price;

}

function savePM(){

    let pmDebt =
        parseFloat(document.getElementById('pmDebt').value) || 0;

    let pmPrice =
        parseFloat(document.getElementById('pmPrice').value) || 0;

    let amDebt =
        parseFloat(localStorage.getItem('amDebt')) || 0;

    let amPrice =
        parseFloat(localStorage.getItem('amPrice')) || 0;

    let debtReduction =
        amDebt - pmDebt;

    let stockMove =
        pmPrice - amPrice;

    let thetaEffect =
        debtReduction * 0.8;

    document.getElementById('pmResult').innerHTML =

        'PM 저장 완료<br><br>' +

        '옵션채무: $' + pmDebt + '<br>' +

        'SOFI 가격: $' + pmPrice;

    document.getElementById('analysis').innerHTML =

        '<span class="green">옵션 채무 감소: $'
        + debtReduction.toFixed(0) +

        '</span><br><br>' +

        '<span class="green">SOFI 변화: $'
        + stockMove.toFixed(2) +

        '</span><br><br>' +

        '<span class="green">세타 효과: $'
        + thetaEffect.toFixed(0) +

        '</span>';

}

</script>

</body>
</html>
