
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOFI Options Dashboard</title>
<style>
body{
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    background:#0b0f14;
    color:white;
    margin:0;
    padding:20px;
}
h1{
    font-size:28px;
}
.card{
    background:#151b22;
    border-radius:16px;
    padding:16px;
    margin-bottom:16px;
}
.big{
    font-size:42px;
    font-weight:bold;
}
.green{color:#00d26a;}
.red{color:#ff5c5c;}
input{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:12px;
    border-radius:10px;
    border:none;
    background:#202833;
    color:white;
    font-size:16px;
}
button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#00d26a;
    color:black;
    font-size:18px;
    font-weight:bold;
}
.row{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
}
.small{
    opacity:0.8;
}
</style>
</head>
<body>

<h1>SOFI Options Engine</h1>

<div class="card">
    <div class="small">TODAY P/L</div>
    <div class="big green" id="totalPnL">$0</div>
</div>

<div class="card">
    <div class="row"><span>Stocks</span><span id="stockPnL">$0</span></div>
    <div class="row"><span>Calls</span><span id="callPnL">$0</span></div>
    <div class="row"><span>Puts</span><span id="putPnL">$0</span></div>
    <div class="row"><span>Theta</span><span id="thetaPnL">$0</span></div>
</div>

<div class="card">
    <h2>Input</h2>

    <label>SOFI Yesterday</label>
    <input type="number" id="yesterdayPrice" value="15.20">

    <label>SOFI Now</label>
    <input type="number" id="nowPrice" value="15.67">

    <label>Shares</label>
    <input type="number" id="shares" value="15101">

    <label>Call P/L</label>
    <input type="number" id="calls" value="-2100">

    <label>Put P/L</label>
    <input type="number" id="puts" value="600">

    <label>Theta Estimate</label>
    <input type="number" id="theta" value="420">

    <button onclick="calculate()">Calculate</button>
</div>

<div class="card">
    <h2>Strategy Notes</h2>
    <div id="notes">
        Waiting for calculation...
    </div>
</div>

<script>
function calculate(){

    const yesterday = parseFloat(document.getElementById('yesterdayPrice').value);
    const now = parseFloat(document.getElementById('nowPrice').value);
    const shares = parseFloat(document.getElementById('shares').value);

    const calls = parseFloat(document.getElementById('calls').value);
    const puts = parseFloat(document.getElementById('puts').value);
    const theta = parseFloat(document.getElementById('theta').value);

    const stockPnL = ((now - yesterday) * shares);

    const total = stockPnL + calls + puts + theta;

    document.getElementById('stockPnL').innerText =
        '$' + stockPnL.toFixed(0);

    document.getElementById('callPnL').innerText =
        '$' + calls.toFixed(0);

    document.getElementById('putPnL').innerText =
        '$' + puts.toFixed(0);

    document.getElementById('thetaPnL').innerText =
        '$' + theta.toFixed(0);

    const totalElement = document.getElementById('totalPnL');

    totalElement.innerText = '$' + total.toFixed(0);

    if(total >= 0){
        totalElement.className = 'big green';
    } else {
        totalElement.className = 'big red';
    }

    let notes = '';

    if(calls < -1500){
        notes += '⚠️ Covered calls are heavily capping upside.<br>';
    }

    if(puts > 0){
        notes += '✅ Put premium is helping cushion movement.<br>';
    }

    if(theta > 0){
        notes += '✅ Theta income is working for you.<br>';
    }

    if(stockPnL > 0){
        notes += '📈 Stock movement contributed positively today.<br>';
    }

    document.getElementById('notes').innerHTML = notes;
}

calculate();
</script>

</body>
</html>
